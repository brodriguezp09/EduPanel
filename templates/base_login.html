<!DOCTYPE html>
{% load tailwind_tags %}
{% load static tailwind_tags %}
<html lang="es" class="h-full bg-neutral-800">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login{% endblock %}</title>
    {% tailwind_css %}
    <link rel="icon" href="{% static 'assets/favicon.ico' %}" type="image/x-icon">
</head>

<body class="h-full">
    <div class="hidden">
        {% include "svg/icons.svg" %}
    </div>
    {% if user.is_authenticated %}
    <nav class="bg-neutral-900 shadow-lg">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="relative flex items-center justify-between h-16">
                <div class="flex-1 flex items-center justify-center sm:items-stretch sm:justify-start">
                    <div class="flex-shrink-0 flex items-center text-white font-bold">
                        EduPanel
                    </div>
                </div>
                <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
                    <span class="text-neutral-400 mr-4">Hola, {{ user.first_name|default:user.username }}</span>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit"
                            class="bg-primary-500 text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-600">
                            Cerrar Sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
