<aside id="logo-sidebar"
    class="fixed top-0 left-0 z-20 w-64 h-screen pt-20 transition-transform -translate-x-full bg-neutral-900 border-r border-neutral-700 lg:translate-x-0"
    :class="{'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen}" aria-label="Sidebar">
    <div class="h-full flex flex-col justify-between px-3 pb-4 overflow-y-auto bg-neutral-900">
        <ul class="space-y-2 font-medium">
            <li>
                <!-- Enlace al Panel Principal -->
                <a href="{% url 'home' %}" class="flex items-center p-2 rounded-lg group 
                    {% if request.resolver_match.url_name == 'home' %}
                        bg-primary-500 text-white
                    {% else %}
                        text-neutral-300 hover:bg-neutral-700 hover:text-white
                    {% endif %}
                ">
                    <svg class="w-5 h-5 transition duration-75 
                        {% if request.resolver_match.url_name == 'home' %}
                            text-white
                        {% else %}
                            text-neutral-500 group-hover:text-primary-400
                        {% endif %}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                        viewBox="0 0 22 21">
                        <path
                            d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z" />
                        <path
                            d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z" />
                    </svg>
                    <span class="ml-3">Panel Principal</span>
                </a>
            </li>
            <!-- Enlace Usuario -->
            <li>
                <a href="{% url 'users:user_detail' user.slug %}" class="flex items-center p-2 rounded-lg group 
                                {% if request.resolver_match.url_name == 'usuario' %}
                                    bg-primary-500 text-white
                                {% else %}
                                    text-neutral-300 hover:bg-neutral-700 hover:text-white
                                {% endif %}
                            ">
                    <svg class="w-5 h-5 transition duration-75 
                                    {% if request.resolver_match.url_name == 'usuario' %}
                                        text-white
                                    {% else %}
                                        text-neutral-500 group-hover:text-primary-400
                                    {% endif %}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path
                            d="M10 8a3 3 0 100-6 3 3 0 000 6zM3.465 14.493a1.23 1.23 0 00.41 1.412A9.957 9.957 0 0010 18c2.31 0 4.438-.784 6.131-2.095a1.23 1.23 0 00.41-1.412A9.99 9.99 0 0010 12a9.99 9.99 0 00-6.535 2.493z" />
                    </svg>
                    <span class="ml-3">{{ user.first_name | default:user.username }}</span>
                </a>
            </li>
            <!-- Enlace a Mis Trámites -->
            <li>
                <a href="{% url 'asuntosParticulares:mis_solicitudes' %}" class="flex items-center p-2 rounded-lg group 
                    {% if request.resolver_match.url_name == 'mis_solicitudes' %}
                        bg-primary-500 text-white
                    {% else %}
                        text-neutral-300 hover:bg-neutral-700 hover:text-white
                    {% endif %}
                ">
                    <svg class="w-5 h-5 transition duration-75 
                        {% if request.resolver_match.url_name == 'mis_solicitudes' %}
                            text-white
                        {% else %}
                            text-neutral-500 group-hover:text-primary-400
                        {% endif %}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path d="M12.75 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 2.25A.75.75 0 017.5 3v1.5h9V3A.75.75 0 0118 3v1.5h.75a3 3 0 013 3v11.25a3 3 0 01-3 3H5.25a3 3 0 01-3-3V7.5a3 3 0 013-3H6V3a.75.75 0 01.75-.75zM5.25 6A1.5 1.5 0 003.75 7.5v11.25c0 .83.67 1.5 1.5 1.5h13.5a1.5 1.5 0 001.5-1.5V7.5A1.5 1.5 0 0018.75 6H5.25z"
                            clip-rule="evenodd" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12.75 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM15.75 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM15.75 15.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12 15.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM8.25 15.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM8.25 12.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />                    
                    </svg>
                    
                    <span class="flex-1 ml-3 whitespace-nowrap">Asuntos particulares</span>
                </a>
            </li>
            <li>
                <!-- Enlace a Documentos -->
                <a href="{% url 'documento:documento_list' %}" class="flex items-center p-2 rounded-lg group 
                                {% if request.resolver_match.url_name == 'documento_list' %}
                                    bg-primary-500 text-white
                                {% else %}
                                    text-neutral-300 hover:bg-neutral-700 hover:text-white
                                {% endif %}
                            ">
                    <svg class="w-5 h-5 transition duration-75 
                                    {% if request.resolver_match.url_name == 'documento_list' %}
                                        text-white
                                    {% else %}
                                        text-neutral-500 group-hover:text-primary-400
                                    {% endif %}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />
                    </svg>
                    <span class="flex-1 ml-3 whitespace-nowrap">Documentos</span>
                </a>
            </li>
        </ul>
        <div>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit"
                    class="w-full flex items-center p-2 text-neutral-300 rounded-lg hover:bg-neutral-700 hover:text-white group text-left">
                    <svg class="w-5 h-5 text-neutral-500 transition duration-75 group-hover:text-primary-400"
                        aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                    </svg>
                    <span class="flex-1 ml-3 whitespace-nowrap">Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </div>
</aside>
